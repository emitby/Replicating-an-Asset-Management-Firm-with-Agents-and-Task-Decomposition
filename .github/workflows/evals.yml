# Offline evals on every push: free, deterministic, no API key.
# Guardrail red-team (74 cases); run scorers apply to saved pipeline runs and live trials.
# Live trials with the real agents cost money and run locally: see docs/evals.md.
name: Evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install into project-local venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --no-cache-dir -r requirements.txt
      - name: Guardrail red-team (via launcher so caches stay in the project)
        # Failing cases are also posted as annotations, which are public (job logs need a sign-in).
        run: |
          set +e
          sh ./run.sh eval > eval.log 2>&1; status=$?
          cat eval.log
          grep -E "FAIL|Error|Traceback" eval.log | cut -c1-300 | sed 's/^/::error::/'
          exit $status

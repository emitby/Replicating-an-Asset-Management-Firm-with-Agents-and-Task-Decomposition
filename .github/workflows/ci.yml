name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install into project-local venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --no-cache-dir -r requirements.txt
      - name: Unit tests (offline, via launcher so caches stay in the project)
        run: sh ./run.sh test -q
